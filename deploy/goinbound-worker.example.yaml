# goinbound-worker configuration.
#
# Only what is ours is here. Stream writers, the instance map, the replication
# secret, track_presence, trusted_key_servers, federation_domain_whitelist and
# the database are all read from homeserver.yaml, so they cannot drift.

# Synapse's config, mounted read-only.
homeserver_yaml: /etc/synapse/homeserver.yaml

# What happens to each kind of payload. Both are required.
#
# edu: transactions carrying only EDUs.
#   proxy     forward to the Python worker untouched (with pdu: proxy, this
#             worker changes nothing at all)
#   shadow    forward, then count what native would have done
#   canary:N  serve natively for N% of origins, forward the rest
#   native    serve natively whenever possible; anything uncertain is still
#             forwarded
#
# pdu: transactions carrying any PDU.
#   proxy     to the Python worker whole, their EDUs included
#   shadow    and afterwards check each PDU Synapse accepted: signatures,
#             state resolution, auth verdict and resulting state, against
#             what Synapse stored. Read-only; see pdu_shadow below.
#   canary:N  write mode for N% of origins (see write below); the shadow
#             still checks every PDU
#   native    write mode for every origin
modes:
  edu: proxy
  pdu: proxy

# Write mode (modes.pdu: canary:N or native) persists PDUs here, as Synapse's
# inbound worker does (docs/write-mode.md). It needs modes.edu to serve the
# same origins (canary:M with M >= N, or native), and a name for this process
# in Synapse's lock tables that no Synapse process uses. The write role is
# created or repaired on every start with homeserver.yaml's credentials, and
# granted exactly the tables write mode writes.
#
# write:
#   instance_name: goinbound-worker
#   role: goinbound_rw
#   # Origins served by write mode whatever the canary percentage (their
#   # EDU-only transactions too): with modes.pdu canary:0, only these.
#   origins: [daedric.net]
#   # An event whose prev events are missing: defer (leave it staged for
#   # Synapse's worker) or fetch (from the origin, as Synapse does).
#   missing_events: defer

# nginx connects here.
listen:
  socket: /var/sockets/nginx/av-goinbound-worker-1.sock
  socket_mode: "0660"

# The Python inbound federation worker: it handles every PDU, and anything we
# leave to it.
upstream:
  sockets:
    - /var/sockets/nginx/av-inbound-federation-worker-1.sock
  timeout_seconds: 180

metrics:
  addr: ":9200"

log:
  level: info
  pretty: false

database:
  # The read-only role this worker serves with. On every start it connects
  # as this role and checks its grants; if the role is missing or lacks
  # something, it is created or repaired with homeserver.yaml's credentials.
  role: goinbound_ro
  # manage_role: false   # never touch the role; create it by hand instead
  #
  # How to reach PostgreSQL as the role (any user named here is replaced by
  # `role`). It must reach PostgreSQL directly: homeserver.yaml goes through
  # pgcat, which only accepts the users in its own config. The unix socket is
  # trusted by pg_hba, so no password is needed. Over TCP, the role's password
  # is derived from homeserver.yaml's and supplied automatically.
  dsn: "host=/var/sockets dbname=synapse-db"
  max_conns: 4

shadow:
  concurrency: 4
  queue: 1000

# modes.pdu: shadow. Each PDU is checked once Synapse has persisted it.
pdu_shadow:
  concurrency: 2
  queue: 1000
  max_wait_seconds: 300   # a PDU whose prev events Synapse must fetch can take minutes
  max_conns: 4
  # Soft-fail and push compare against a snapshot of the room taken when
  # Synapse is about to handle the PDU: once its prev events are persisted.
  prev_wait_seconds: 60
  # The state group cache, in state entries (~210 bytes each). A big room's
  # state is 150k entries, so this keeps a couple of its latest groups.
  state_cache_entries: 400000

# An origin we had backed off that sends us a transaction is alive: Synapse
# resets its backoff and tells every process (transport/server/_base.py:143).
# With this set, that is done by Synapse's admin API on main (the same reset,
# cache invalidation included), then REMOTE_SERVER_UP is published on the
# redis of homeserver.yaml. Unset, those transactions are proxied.
#origin_up:
#  admin_api: /var/sockets/nginx/av-synapse-main.sock   # main's client listener
#  access_token_file: /data/admin-token                  # a server admin's token
