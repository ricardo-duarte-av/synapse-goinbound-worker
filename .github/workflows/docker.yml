name: Build container images

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Don't publish an image that doesn't build or whose tests fail.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      # -race is not optional: concurrent requests share the per-origin
      # claims, the response cache and the ACL cache, and EDUs of one
      # transaction are forwarded concurrently.
      #
      # The live tests skip themselves unless their env vars are set, so this
      # runs the unit tests only and never needs a database.
      - run: go test -race ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to push to GitHub's container registry.
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - binary: goinbound-worker
            dockerfile: Dockerfile
            image: ${{ github.repository }}
            # A missing config must be reported and exit non-zero, not panic.
            smoke: -config /nonexistent.yaml

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests from forks cannot access the registry, so only log in
      # when we will actually push.
      - name: Log in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            # :latest only for the default branch, so feature branches don't overwrite it
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            # A moving :0.1 that follows the latest 0.1.x patch release
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # .dockerignore strips .git, so the build cannot read these itself.
          build-args: |
            # ref_name is the tag for a tag push and the branch otherwise,
            # so -version always reports something meaningful.
            TAG=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=${{ matrix.binary }}
          cache-to: type=gha,mode=max,scope=${{ matrix.binary }}

      # The failure mode worth catching is an image that builds but cannot
      # start. -version exercises the entrypoint and the stamped build info
      # without needing a database.
      - name: Smoke test the image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run --rm "$IMAGE" -version
          # Starting with an unusable configuration must fail loudly rather
          # than come up and silently do nothing.
          if docker run --rm "$IMAGE" ${{ matrix.smoke }}; then
            echo "expected an unusable configuration to fail"
            exit 1
          fi
